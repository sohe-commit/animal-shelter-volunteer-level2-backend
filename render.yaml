# Render Blueprint: Render 대시보드에서 New → Blueprint로 이 저장소를 고르면 아래 설정으로 서버가 만들어집니다.
# 비밀 값(sync: false)은 만들 때 Render 화면에서 직접 입력합니다.
services:
  - type: web
    name: animal-shelter-volunteer-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: STAFF_PASSWORD
        sync: false
